<!doctype html>
<meta charset="utf-8">
<title>DSP test</title>
<script type="module">
import { FX, FX_BY_ID, ORDER, buildEQ, defaultParams } from '../web/js/effects.js';

const SR = 48000;
function makeSignal(ctx, secs, fn) {
  const b = ctx.createBuffer(2, Math.round(secs * SR), SR);
  const L = b.getChannelData(0), R = b.getChannelData(1);
  for (let i = 0; i < L.length; i++) { const t = i / SR; const [l, r] = fn(t, i); L[i] = l; R[i] = r; }
  return b;
}
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// "music-like" test signal: bass + chords + centered vocal + side instruments + noise hits
const music = (t) => {
  const bass = 0.22 * Math.sin(2 * Math.PI * 55 * t);
  const chord = 0.07 * (Math.sin(2 * Math.PI * 220 * t) + Math.sin(2 * Math.PI * 277.2 * t) + Math.sin(2 * Math.PI * 329.6 * t));
  const voc = 0.15 * Math.sin(2 * Math.PI * 440 * t + 3 * Math.sin(2 * Math.PI * 5 * t));
  const hit = (t % 0.5) < 0.03 ? (rnd() * 2 - 1) * 0.25 * (1 - (t % 0.5) / 0.03) : 0;
  const sL = 0.06 * Math.sin(2 * Math.PI * 660 * t), sR = 0.06 * Math.sin(2 * Math.PI * 990 * t);
  const c = bass + chord + voc + hit;
  return [c + sL, c + sR];
};

async function render(build, params, sigFn, secs = 3, extraSecs = 0) {
  const ctx = new OfflineAudioContext(2, Math.round((secs + extraSecs) * SR), SR);
  await ctx.audioWorklet.addModule('../web/js/fx-worklet.js');
  const src = ctx.createBufferSource();
  src.buffer = makeSignal(ctx, secs, sigFn);
  const m = build(ctx, {});
  for (const [k, v] of Object.entries(params)) m.set(k, v);
  if (m.ready) await m.ready;
  src.connect(m.input); m.output.connect(ctx.destination);
  src.start();
  const out = await ctx.startRendering();
  return [out.getChannelData(0), out.getChannelData(1)];
}
function stats(L, R, from = 0, to = L.length) {
  let s = 0, pk = 0, nan = 0, sl = 0, sr = 0, slr = 0;
  for (let i = from; i < to; i++) {
    const l = L[i], r = R[i];
    if (!Number.isFinite(l) || !Number.isFinite(r)) { nan++; continue; }
    s += (l * l + r * r) / 2; pk = Math.max(pk, Math.abs(l), Math.abs(r)); sl += l * l; sr += r * r; slr += l * r;
  }
  const n = to - from;
  return { rmsDb: +(10 * Math.log10(s / n + 1e-20)).toFixed(1), peak: +pk.toFixed(3), nan, corr: +(slr / Math.sqrt(sl * sr + 1e-20)).toFixed(2), lDb: +(10 * Math.log10(sl / n + 1e-20)).toFixed(1), rDb: +(10 * Math.log10(sr / n + 1e-20)).toFixed(1) };
}
// magnitude (dB) of a single frequency via Goertzel on channel
function tone(x, f, from = 0, to = x.length) {
  const w = 2 * Math.PI * f / SR, c = 2 * Math.cos(w); let s0 = 0, s1 = 0, s2 = 0;
  for (let i = from; i < to; i++) { s0 = x[i] + c * s1 - s2; s2 = s1; s1 = s0; }
  const p = s1 * s1 + s2 * s2 - c * s1 * s2;
  return +(10 * Math.log10(p / ((to - from) ** 2) * 4 + 1e-20)).toFixed(1);
}
const sine = (f, a = 0.5) => t => { const v = a * Math.sin(2 * Math.PI * f * t); return [v, v]; };

window.runTests = async () => {
  const res = { generic: {}, checks: {} };
  // reference stats of the dry signal
  const dry = await render(ctx => { const g = ctx.createGain(); return { input: g, output: g, set() {} }; }, {}, music);
  res.generic.__dry = stats(dry[0], dry[1], SR * 0.5);
  for (const def of FX) {
    if (def.pseudo) continue;
    try {
      const [L, R] = await render(def.build, defaultParams(def), music, 3, 0.5);
      const st = stats(L, R, SR * 0.5, SR * 3);
      // how different from dry (residual)
      let d = 0, n = 0; for (let i = SR * 0.5; i < SR * 3; i++) { const e = L[i] - dry[0][i]; d += e * e; n++; }
      st.diffDb = +(10 * Math.log10(d / n + 1e-20)).toFixed(1);
      st.tail = stats(L, R, SR * 3.05, SR * 3.5).rmsDb;
      res.generic[def.id] = st;
    } catch (e) { res.generic[def.id] = { error: String(e) }; }
  }
  const C = res.checks;
  // pitch: dominant frequency + share of energy within ±15 Hz of the target
  const pitchCheck = async (st, f0, sig) => {
    const [L] = await render(FX_BY_ID.pitch.build, { semitones: st }, sig || sine(f0), 2.5);
    const target = f0 * Math.pow(2, st / 12);
    let best = 0, bf = 0, band = 0, tot = 0;
    for (let f = 100; f <= 2000; f += 1) { const p = Math.pow(10, tone(L, f, SR, 2 * SR) / 10); tot += p; if (Math.abs(f - target) <= 15) band += p; if (p > best) { best = p; bf = f; } }
    return { target: +target.toFixed(1), peakHz: bf, bandShare: +(band / tot).toFixed(2) };
  };
  C.pitch12 = await pitchCheck(12, 440);
  C.pitchm5 = await pitchCheck(-5, 440);
  C.pitch3_220 = await pitchCheck(3, 220);
  // harmonic tone (sawtooth-ish, 8 partials) +4 semitones
  C.pitch4_saw = await pitchCheck(4, 196, t => { let v = 0; for (let k = 1; k <= 8; k++) v += Math.sin(2 * Math.PI * 196 * k * t) / k; v *= 0.25; return [v, v]; });
  // karaoke: centred 1k sine removed, side 700Hz kept
  { const sig = t => { const c = 0.4 * Math.sin(2 * Math.PI * 1000 * t), s = 0.2 * Math.sin(2 * Math.PI * 700 * t); return [c + s, c - s]; };
    const [L] = await render(FX_BY_ID.karaoke.build, defaultParams(FX_BY_ID.karaoke), sig, 2);
    const d = await render(ctx => { const g = ctx.createGain(); return { input: g, output: g, set() {} }; }, {}, sig, 2);
    C.karaoke = { center1k_before: tone(d[0], 1000, SR), center1k_after: tone(L, 1000, SR), side700_before: tone(d[0], 700, SR), side700_after: tone(L, 700, SR) }; }
  // crossfeed: left-only 200 Hz → right gets signal
  { const [L, R] = await render(FX_BY_ID.crossfeed.build, defaultParams(FX_BY_ID.crossfeed), t => [0.5 * Math.sin(2 * Math.PI * 200 * t), 0], 1);
    C.crossfeed = { L200: tone(L, 200, SR / 2), R200: tone(R, 200, SR / 2) }; }
  // EQ +12 dB at 1k
  { const [L] = await render(buildEQ, { b5: 12 }, sine(1000, 0.1), 1); C.eq1k = { gainDb: +(tone(L, 1000, SR / 2) - tone(new Float32Array(SR).map((_, i) => 0.1 * Math.sin(2 * Math.PI * 1000 * i / SR)), 1000, SR / 2)).toFixed(1) }; }
  // virtual bass: 60 Hz → harmonics
  { const [L] = await render(FX_BY_ID.vbass.build, { amount: 100, cutoff: 110 }, sine(60, 0.4), 1.5); C.vbass = { h60: tone(L, 60, SR / 2), h120: tone(L, 120, SR / 2), h180: tone(L, 180, SR / 2) }; }
  // sub harmonic: 80 Hz → 40 Hz
  { const [L] = await render(FX_BY_ID.subharm.build, { amount: 100, cutoff: 120 }, sine(80, 0.4), 1.5); C.subharm = { f80: tone(L, 80, SR / 2), f40: tone(L, 40, SR / 2) }; }
  // leveler: quiet signal raised
  { const [L, R] = await render(FX_BY_ID.leveler.build, defaultParams(FX_BY_ID.leveler), t => { const v = 0.02 * Math.sin(2 * Math.PI * 300 * t); return [v, v]; }, 6);
    C.leveler = { start: stats(L, R, 0, SR / 2).rmsDb, end: stats(L, R, SR * 5, SR * 6).rmsDb }; }
  // limiter: hot input
  { const [L, R] = await render(FX_BY_ID.limiter.build, defaultParams(FX_BY_ID.limiter), t => { const v = 1.8 * Math.sin(2 * Math.PI * 100 * t) * (t > 0.5 ? 1 : 0.1); return [v, v]; }, 2);
    C.limiter = stats(L, R, SR * 0.6, SR * 2); }
  // 8D: mono in → L/R alternate over time
  { const [L, R] = await render(FX_BY_ID.rotate8d.build, { period: 2, mix: 100 }, sine(500, 0.3), 2.2);
    const q = [0.3, 0.8, 1.3, 1.8].map(t => { const s = stats(L, R, Math.round(t * SR), Math.round((t + 0.1) * SR)); return [s.lDb, s.rDb]; }); C.rotate8d = q; }
  // virtualizer: produces output, no NaN
  { const [L, R] = await render(FX_BY_ID.virtualizer.build, defaultParams(FX_BY_ID.virtualizer), music, 2); C.virtualizer = stats(L, R, SR / 2); }
  // tremolo modulation depth
  { const [L, R] = await render(FX_BY_ID.tremolo.build, { rate: 4, depth: 100 }, sine(1000, 0.5), 1.5);
    let mn = 1, mx = 0; for (let k = 0; k < 24; k++) { const s = stats(L, R, SR / 2 + k * 960, SR / 2 + (k + 1) * 960).rmsDb; mn = Math.min(mn, s); mx = Math.max(mx, s); } C.tremolo = { minDb: mn, maxDb: mx }; }
  return res;
};
window.__ready = true;
</script>
